version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: eurt-surmai_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/rohitkumbhar/surmai:v0.5.3@sha256:5220ee5a1f11ddda1b3f614ed0a757a2feccf9672854c2c1698c01cf99a3a10c
    user: "1000:1000"
    restart: on-failure
    environment:
      SURMAI_ADMIN_EMAIL: admin@umbrel.local
      SURMAI_ADMIN_PASSWORD: ${APP_PASSWORD}
      PB_DATA_DIRECTORY: /pb_data
    volumes:
      - ${APP_DATA_DIR}/data/pb_data:/pb_data
