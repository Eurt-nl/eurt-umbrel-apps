version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: eurt-instatic_server_1
      APP_PORT: 3001
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/corebunch/instatic:0.0.14@sha256:d3760945ab822c77a1709c7ee980bbb5f5dcb4b72c7bdaae1d4fd9cccb52b2ff
    restart: on-failure
    environment:
      PORT: 3001
      DATABASE_URL: sqlite:/app/data/cms.db
      UPLOADS_DIR: /app/uploads
      STATIC_DIR: /app/dist
      INSTATIC_SECRET_KEY: ${APP_INSTATIC_SECRET_KEY}
    volumes:
      - ${APP_DATA_DIR}/data/db:/app/data
      - ${APP_DATA_DIR}/data/uploads:/app/uploads
